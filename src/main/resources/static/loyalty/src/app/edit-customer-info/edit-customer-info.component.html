<div class="edit-container">
  <h2>Edit Customer Information</h2>

  <mat-spinner *ngIf="isLoading" class="loading-spinner"></mat-spinner>

  <form *ngIf="!isLoading" [formGroup]="editForm" (ngSubmit)="onSubmit()" class="edit-form">
    <mat-form-field appearance="fill">
      <mat-label>First Name</mat-label>
      <input matInput formControlName="firstName" required />
      <mat-error *ngIf="editForm.get('firstName')?.hasError('required')">
        First Name is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Last Name</mat-label>
      <input matInput formControlName="lastName" required />
      <mat-error *ngIf="editForm.get('lastName')?.hasError('required')">
        Last Name is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" required />
      <mat-error *ngIf="editForm.get('email')?.hasError('required')">
        Email is required
      </mat-error>
      <mat-error *ngIf="editForm.get('email')?.hasError('email')">
        Please enter a valid email
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Phone</mat-label>
      <input matInput formControlName="phone" required />
      <mat-error *ngIf="editForm.get('phone')?.hasError('required')">
        Phone is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Current Points</mat-label>
      <input matInput type="number" formControlName="currentPoints" required />
      <mat-error *ngIf="editForm.get('currentPoints')?.hasError('required')">
        Points are required
      </mat-error>
      <mat-error *ngIf="editForm.get('currentPoints')?.hasError('min')">
        Points cannot be negative
      </mat-error>
    </mat-form-field>

    <div class="form-actions">
      <button 
        mat-raised-button 
        color="primary" 
        type="submit"
        [disabled]="editForm.invalid || isUpdating"
      >
        <span *ngIf="!isUpdating">Save Changes</span>
        <span *ngIf="isUpdating">Saving...</span>
      </button>
    </div>
  </form>
</div>
