<mat-card>
  <mat-card-title>Reward Redemption History for User #{{ userId }}</mat-card-title>

  <mat-card-content>
    <div *ngIf="isLoading">
      <mat-spinner diameter="50"></mat-spinner>
      <p>Loading reward history...</p>
    </div>

    <div *ngIf="error">
      <p>{{ error }}</p>
    </div>

    <div *ngIf="!isLoading && !error">
      <button mat-raised-button color="primary" (click)="exportToExcel()">Export to Excel</button>
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
        <!-- Reward ID -->
        <ng-container matColumnDef="rewardId">
          <th mat-header-cell *matHeaderCellDef>Reward ID</th>
          <td mat-cell *matCellDef="let redemption">{{ redemption.rewardId }}</td>
        </ng-container>

        <!-- Created At -->
        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef>Redeemed On</th>
          <td mat-cell *matCellDef="let redemption">{{ redemption.createdAt | date: 'medium' }}</td>
        </ng-container>

        <!-- Updated At -->
        <ng-container matColumnDef="updatedAt">
          <th mat-header-cell *matHeaderCellDef>Last Updated</th>
          <td mat-cell *matCellDef="let redemption">{{ redemption.updatedAt | date: 'medium' }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>
