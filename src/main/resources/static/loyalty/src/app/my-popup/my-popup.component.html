<div class="popup-overlay">
  <div class="popup-content">
    <h2>Add Points</h2>

    <div class="form-group">
      <label for="points">Points to Add:</label>
      <input type="number" [(ngModel)]="points" name="points" id="points" class="form-control" required min="1" />
    </div>

    <div class="form-group">
      <label for="description">Description:</label>
      <textarea [(ngModel)]="description" name="description" id="description" class="form-control"></textarea>
    </div>

    <div class="popup-actions">
      <button class="btn btn-confirm" (click)="confirm()" [disabled]="points <= 0">Confirm</button>
      <button class="btn btn-cancel" (click)="cancel()">Cancel</button>
    </div>
  </div>
</div>
